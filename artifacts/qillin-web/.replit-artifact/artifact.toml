kind = "web"
previewPath = "/"
title = "Qillin"
version = "1.0.0"
id = "artifacts/qillin-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19161

[services.development]
run = "pnpm --filter @workspace/qillin-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qillin-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/qillin-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19161"
BASE_PATH = "/"
