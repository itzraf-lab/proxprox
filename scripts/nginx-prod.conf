# Qillin production nginx site.
# Installed by `make prod-nginx` (part of `make prod`). Placeholders:
#   @SERVER_NAME@ — kept from the site file being replaced (`_` if none)
#   @WEB_ROOT@    — absolute path to apps/web/dist/public
# Mirrors the Vite dev proxy: static files are served directly, while /api and
# /v1 go to the Express API on 127.0.0.1:8080 (which in turn proxies /v1 to
# LiteLLM on :8000 after auth, billing, and prompt-cache middleware).
server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAME@;

    root @WEB_ROOT@;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Express API (auth, admin, billing, usage callbacks, …)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAI-compatible endpoint. SSE streaming needs buffering off and a long
    # read timeout or nginx cuts slow model responses.
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Vite emits content-hashed files under /assets — safe to cache forever.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: everything else serves the React app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
