# Qillin production nginx site — HTTPS variant.
# Installed by `make prod-nginx` when a Let's Encrypt certificate exists for
# the site's server_name at /etc/letsencrypt/live/@SERVER_NAME@/ (i.e. after
# `certbot --nginx -d @SERVER_NAME@` has run once). Mirrors the same layout
# certbot generates: a 443 server with the app config and an 80 server that
# redirects to HTTPS. Certificate renewal is handled by certbot's scheduled
# task; the nginx authenticator works fine with this redirect in place.
server {
    server_name @SERVER_NAME@;

    root @WEB_ROOT@;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Express API (auth, admin, billing, usage callbacks, …)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAI-compatible endpoint. SSE streaming needs buffering off and a long
    # read timeout or nginx cuts slow model responses.
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Vite emits content-hashed files under /assets — safe to cache forever.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: everything else serves the React app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/@SERVER_NAME@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@SERVER_NAME@/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS redirect.
server {
    if ($host = @SERVER_NAME@) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name @SERVER_NAME@;
    return 404;
}
