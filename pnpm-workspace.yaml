packages:
  - apps/api-server
  - apps/web
  - packages/*

autoInstallPeers: false

catalog:
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.101.4
  '@types/node': ^26.1.2
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.0.5
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.43.0
  lucide-react: ^1.28.0
  # react / react-dom are pinned on purpose (not upgraded by scripts/update.sh):
  # the shadcn/Radix component stack is validated against this exact version.
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tsx: ^4.21.0
  vite: ^8.2.0
  wouter: ^3.10.0
  zod: ^4.4.3

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - '@swc/core'
  - better-sqlite3
  - esbuild
  - msw
  - unrs-resolver

overrides:
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  esbuild: 0.28.1
